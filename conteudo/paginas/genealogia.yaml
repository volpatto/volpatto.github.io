  - type: prose
    title:
      pt: E o que isso muda?
      en: And what difference does it make?
    text:
      pt: |
        Qual a importância disso tudo, para mim ou para quem trabalha comigo? Para mim, nenhuma — mas certamente foi divertido pesquisar e construir essa árvore. Agradeço ao [Mathematics Genealogy Project](https://www.mathgenealogy.org/), à [Plataforma Acácia](https://www.plataforma-acacia.org/), ao [MacTutor](https://mathshistory.st-andrews.ac.uk/), aos arquivos do LNCC, da UFRJ e de Stanford e às demais fontes listadas acima por preservarem essas histórias.
      en: |
        What does any of this mean for me, or for someone working with me? To me, nothing — but researching and building this tree was certainly fun. My thanks to the [Mathematics Genealogy Project](https://www.mathgenealogy.org/), [Plataforma Acácia](https://www.plataforma-acacia.org/), [MacTutor](https://mathshistory.st-andrews.ac.uk/), the LNCC, UFRJ and Stanford archives, and the other sources listed above for preserving these stories.
