      - id: thermophase
        title: ThermoPhase
        eyebrow: UDESC / LNCC
        subtitle:
          pt: Coliderança
          en: Co-leader
        text:
          pt: >-
            O ThermoPhase é um grupo de pesquisa multi-institucional, com atuação tanto no LNCC
            quanto na UDESC. Estuda modelagem termodinâmica e simulação numérica de fluidos
            complexos, conectando dados e aprendizado de máquina. As aplicações incluem captura,
            utilização e armazenamento de carbono (CCUS) e armazenamento subterrâneo de hidrogênio
            (UHS), no contexto da transição energética.


            As atividades incluem orientação de alunos e desenvolvimento de ferramentas como
            torch-flash e thermoml-io, com exemplos computacionais documentados e pacotes Python
            reutilizáveis.
          en: >-
            ThermoPhase is a multi-institutional research group based at both LNCC and UDESC. It
            studies thermodynamic modeling and numerical simulation of complex fluids, connecting
            data and machine learning. Applications include carbon capture, utilization and storage
            (CCUS) and underground hydrogen storage (UHS), in the context of the energy transition.


            Activities include student supervision and development of tools such as torch-flash and
            thermoml-io, with documented computational examples and reusable Python packages.
