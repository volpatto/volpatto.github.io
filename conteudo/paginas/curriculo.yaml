    Minha trajetória reúne pesquisa acadêmica, ensino e desenvolvimento profissional de software
    científico. Desde 2025, sou pesquisador do LNCC, após uma atuação na indústria de software.
  en: >-
    My work combines academic research, teaching and professional scientific software development.
    Since 2025, I have been a researcher at LNCC, following my experience in the software industry.
