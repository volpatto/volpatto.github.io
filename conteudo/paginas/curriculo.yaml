        eyebrow: LNCC
        text:
          pt: |-
            Métodos de elementos finitos híbridos e descontínuos para escoamentos em meios porosos.

            Título: Hybrid and Discontinuous Finite Element Methods for porous media flow problems

            Orientação: Abimael Fernando Dourado Loula. Coorientação: Antônio Tadeu Azevedo Gomes.
          en: |-
            Hybrid and discontinuous finite element methods for porous media flow.

            Thesis: Hybrid and Discontinuous Finite Element Methods for porous media flow problems

            Supervisor: Abimael Fernando Dourado Loula. Co-supervisor: Antônio Tadeu Azevedo Gomes.
      - period: "2016"
        title:
          pt: Mestrado em Modelagem Computacional
          en: MSc in Computational Modeling
        eyebrow: LNCC
        text:
          pt: >-
            Acoplamento hidro-geomecânico em reservatórios não convencionais de gás.


            Título: Modelagem Computacional do Acoplamento Hidro-geomecânico em Reservatórios
            Não-Convencionais de Gás


            Orientação: Márcio Arab Murad. Coorientação: Eduardo Lúcio Mendes Garcia.
          en: >-
            Hydro-geomechanical coupling in unconventional gas reservoirs.


            Thesis: Modelagem Computacional do Acoplamento Hidro-geomecânico em Reservatórios
            Não-Convencionais de Gás


            Supervisor: Márcio Arab Murad. Co-supervisor: Eduardo Lúcio Mendes Garcia.
