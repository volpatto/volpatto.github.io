  - type: prose
    text:
      pt: Currículo acadêmico com dados do Lattes atualizado em 23 de agosto de 2026. O registro completo
        está disponível na Plataforma Lattes.
      en: Academic CV based on the Lattes record updated on 23 August 2026. The complete record is
        available on the Lattes platform.
  - type: timeline
    id: experience-title
    title:
      pt: Experiência profissional
      en: Professional experience
    items:
      - period:
          pt: Fev. 2025 – atual
          en: Feb 2025 – present
        title:
          pt: Pesquisador adjunto
          en: Staff Research Scientist
        eyebrow: LNCC / MCTI
        text:
          pt: Pesquisa em métodos matemáticos e computacionais e atuação como docente permanente no Programa
            de Pós-Graduação em Modelagem Computacional. Ensino, orientação e desenvolvimento de
            métodos numéricos e software científico.
          en: Research in mathematical and computational methods and faculty membership in the Graduate
            Program in Computational Modeling. Teaching, supervision, and development of numerical
            methods and scientific software.
      - period:
          pt: Ago. 2018 – fev. 2025
          en: Aug 2018 – Feb 2025
        title:
          pt: Desenvolvedor de software científico sênior
          en: Senior Scientific Developer
        eyebrow: ESSS · Engineering Simulation and Scientific Software
        text:
          pt: >-
            Desenvolvimento profissional de software científico para a indústria de óleo e gás, com
            implementação de modelos matemáticos, métodos numéricos e bibliotecas computacionais.
            Essa atuação reuniu programação científica em C++ e Python e aplicações em propriedades
            de fluidos, meios porosos e geoquímica.


            - Equilíbrio de fases e propriedades PVT: desenvolvimento da biblioteca PVTlib para
            fluidos de petróleo.

            - Rocha digital: manutenção e desenvolvimento do software PORE, com modelos de redes de
            poros, acoplamento geoquímico e transferência de escala.

            - Geoquímica: implementação de modelos de coeficiente de atividade para misturas de
            eletrólitos na biblioteca Reaktoro, em C++.

            - Quantificação de incertezas: desenvolvimento de biblioteca interna para calibração de
            modelos e análise de sensibilidade.
          en: >-
            Professional scientific software development for the oil and gas industry, implementing
            mathematical models, numerical methods and computational libraries. This work combined
            scientific programming in C++ and Python with applications in fluid properties, porous
            media and geochemistry.


            - Phase equilibria and PVT properties: development of the PVTlib library for petroleum
            fluids.

            - Digital rock analysis: maintenance and development of PORE, including pore network
            models, geochemical coupling and upscaling.

            - Geochemistry: implementation of activity coefficient models for electrolyte mixtures
            in the C++ Reaktoro library.

            - Uncertainty quantification: development of an internal library for model calibration
            and sensitivity analysis.
  - type: prose
    text:
      pt: Essa experiência na indústria orienta as práticas de testes, distribuição e reprodutibilidade
        dos meus projetos de [software científico](/software/).
      en: This industry experience informs the testing, packaging and reproducibility practices used in my
        [scientific software projects](/en/software/).
