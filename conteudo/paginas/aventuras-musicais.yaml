  - type: prose
    title:
      pt: Para ouvir
      en: For your listening list
    text:
      pt: |
        Algumas recomendações musicais: Rush, Pain of Salvation, Madonna, Siam Shade, Dream Theater, Angra, Azymuth, Calcinha Preta, Limão com Mel, Mastruz com Leite e Banda Grafith.
      en: |
        A few of my music recommendations: Rush, Pain of Salvation, Madonna, Siam Shade, Dream Theater, Angra, Azymuth, Calcinha Preta, Limão com Mel, Mastruz com Leite and Banda Grafith.
  - type: prose
    title:
      pt: A cena independente de Natal
      en: Natal’s independent music scene
    text:
      pt: |
        Entre as bandas independentes e autorais de Natal em atividade, recomendo **Kataphero**, **Bloody Dragon** e **Swards**.

        **Apoie a cena local independente.**
      en: |
        Among Natal’s active independent bands writing and performing their own music, I recommend **Kataphero**, **Bloody Dragon** and **Swards**.

        **Support your local independent music scene.**
