  pt: Aventuras musicais
  en: Musical adventures
paths:
  pt: curiosidades/aventuras-musicais/
  en: en/curiosities/musical-adventures/
description:
  pt: Memórias dos tempos de banda em Natal, fotos de palco e algumas recomendações musicais.
  en: Memories of playing in bands in Natal, stage photos and a few music recommendations.
icon: lucide:music
sections:
  - type: prose
    text:
      pt: |
        Esse sim é um fato divertido! Da adolescência ao início da vida adulta, fui relativamente atuante na cena musical de Natal/RN. Fui baixista em bandas de jazz, pop-rock, rock e metal e cheguei a gravar um álbum profissionalmente, além de alguns EPs e demos.

        Eram bons tempos!
      en: |
        Now that’s a fun fact! From my teenage years through early adulthood, I was fairly active in the music scene in Natal, Rio Grande do Norte, Brazil. I played bass in jazz, pop-rock, rock and metal bands, and even recorded an album professionally, as well as a few EPs and demos.

        Those were good times!
