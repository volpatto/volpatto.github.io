          en: Reactive transport — Kyas et al. (2022)
        description:
          pt: >-
            © Os autores, 2022. Painéis 3(c–d) de [Kyas, Volpatto, Saar e
            Leal](https://doi.org/10.1007/s10596-021-10126-2), publicados originalmente sob [CC BY
