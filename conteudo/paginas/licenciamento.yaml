            and converted to PNG; the visual data were preserved. Attribution for reuse belongs to
            the article’s authors.
      - title:
          pt: SciML — Souza et al. (2026)
          en: SciML — Souza et al. (2026)
        description:
          pt: >-
            © Os autores, 2026. Figura 3 de [Modeling flash points of biofuels using
            thermodynamically consistent neural
            networks](https://doi.org/10.1016/j.fluid.2026.114673), de Maurício Prado de Omena
