            compartilhá-los e adaptá-los, inclusive para fins comerciais, com atribuição adequada,
            link para a licença e indicação das alterações.
          en: >-
            Except for the materials identified on this page, original editorial text by Diego
            Tavares Volpatto is licensed under [Creative Commons Attribution 4.0
            International](https://creativecommons.org/licenses/by/4.0/). You may share and adapt
            them, including commercially, with appropriate attribution, a link to the license and an
            indication of changes.
      - text:
          pt: >-
            Isso inclui a redação autoral da apresentação, das descrições de pesquisa e das demais
            seções editoriais nos dois idiomas, inclusive quando esses textos estão incorporados aos
            arquivos de código. A licença abrange somente os direitos que o autor pode licenciar.
          en: >-
            This applies to the original wording of the biography, research descriptions and other
            editorial sections in both languages, including that text when embedded in source files.
            It covers only rights that the author is entitled to license.
      - text:
          pt: >-
            Exemplo de atribuição: Diego Tavares Volpatto, [site acadêmico](/), CC BY 4.0. Indique
            as adaptações, quando houver.
          en: >-
            Attribution example: Diego Tavares Volpatto, [academic website](/en/), CC BY 4.0.
            Indicate any adaptations you make.
        class: license-attribution
      - text:
          pt: "[Texto integral da licença (inglês)](/licenses/CC-BY-4.0.txt)"
          en: "[Full license text (English)](/licenses/CC-BY-4.0.txt)"
    credits: []
