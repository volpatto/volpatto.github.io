  en: Licensing and credits
introduction:
  pt: >-
    Os textos autorais e o código deste site têm licenças distintas. Imagens, logos, documentos para
    download e materiais de outras fontes seguem as condições identificadas abaixo.
  en: >-
    The original text and the code of this website have separate licenses. Images, logos,
    downloadable documents and material from other sources follow the conditions identified below.
sections:
