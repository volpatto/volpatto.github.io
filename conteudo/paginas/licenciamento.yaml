            without changes to the image. The source project’s terms remain applicable; the website
            licenses do not relicense this figure.
      - title:
          pt: Equilíbrio de fases — GibbsFlashNN
          en: Phase equilibria — GibbsFlashNN
        description:
          pt: >-
            Figura do [estudo
            GibbsFlashNN](https://github.com/ThermoPhase-FCSRG/gibbsflashnn-supporting-material),
