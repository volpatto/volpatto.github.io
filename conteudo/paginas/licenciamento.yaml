page:
  id: licensing
  label:
    pt: Licenciamento
    en: Licensing
  path:
    pt: licenciamento/
    en: en/licensing/
  description:
    pt: >-
      Licenças dos textos e do código do site de Diego Volpatto, com créditos e condições dos
      materiais de outras fontes.
    en: >-
      Licenses for the text and code of Diego Volpatto’s website, with credits and terms for
      materials from other sources.
heading:
