sections:
  - type: prose
    text:
      pt: Colaboro com grupos da UNICAMP e da UDESC em modelagem computacional, termodinâmica e aplicações
        no setor de energia.
      en: I collaborate with research groups at UNICAMP and UDESC on computational modeling,
        thermodynamics and applications in the energy sector.
  - type: cards
    layout: rows
    items:
      - id: alfa
        title:
          pt: ALFA
          en: ALFA
        eyebrow: CEPETRO / UNICAMP
        subtitle: Artificial Lift and Flow Assurance Research Group
        text:
          pt: >-
            O ALFA estuda elevação artificial, garantia de escoamento e escoamentos em sistemas de
            produção de petróleo. O grupo reúne pesquisa experimental e computacional no CEPETRO e
            na Faculdade de Engenharia Mecânica da UNICAMP.


            Minha colaboração se relaciona à modelagem computacional de sistemas de produção. Sou
            pesquisador visitante convidado no CEPETRO desde 2024 e participo do projeto de sistemas
            híbridos de dados e modelos para monitoramento de poços offshore, coordenado por Marcelo
            Souza de Castro.
          en: >-
            The ALFA group studies artificial lift, flow assurance and fluid flow in petroleum
            production systems. It brings together experimental and computational research at
            CEPETRO and the School of Mechanical Engineering at UNICAMP.


            My collaboration is connected to computational modeling of production systems. I have
            been an invited visiting researcher at CEPETRO since 2024 and participate in the project
            on hybrid data and model systems for offshore well monitoring, coordinated by Marcelo
            Souza de Castro.
        images:
          - src: /images/alfa.webp
            alt:
              pt: ALFA
              en: ALFA
            width: 250
            height: 80
          - src: /images/unicamp.svg
            alt:
              pt: Unicamp
              en: Unicamp
            width: 80
            height: 80
        links:
          - label:
              pt: Grupo e equipe
              en: Group and team
            url:
              pt: https://www.alfa.cepetro.unicamp.br/team/
              en: https://www.alfa.cepetro.unicamp.br/team/
            icon: lucide:arrow-up-right
          - label:
              pt: Linhas de pesquisa
              en: Research areas
            url:
              pt: https://www.alfa.cepetro.unicamp.br/research-lines/
              en: https://www.alfa.cepetro.unicamp.br/research-lines/
            icon: lucide:arrow-up-right
      - id: lef
        title:
          pt: LEF — Laboratório de Equilíbrio de Fases
          en: LEF — Phase Equilibria Laboratory
        eyebrow: FEQ / UNICAMP
        text:
          pt: >-
            Sob responsabilidade de Mariana Conceição da Costa, o LEF estuda equilíbrio de fases,
            propriedades termofísicas e pontos de fulgor, combinando medidas experimentais e
            modelagem termodinâmica.


            Desde 2024, tenho coorientado alunos de pós-graduação e iniciação científica em
            colaboração com o LEF. O trabalho inclui modelos de redes neurais para pontos de fulgor
            de biocombustíveis, com artigos publicados em Fluid Phase Equilibria em 2025 e 2026.
          en: >-
            Led by Mariana Conceição da Costa, LEF studies phase equilibria, thermophysical
            properties and flash points, combining experimental measurements with thermodynamic
            modeling.


            Since 2024, I have co-supervised graduate and undergraduate research students in
            collaboration with LEF. Our work includes neural-network models for biofuel flash
            points, with papers published in Fluid Phase Equilibria in 2025 and 2026.
        images:
          - src: /images/lef-original.png
            alt: LEF — Laboratório de Equilíbrio de Fases
            width: 1334
            height: 1334
            viewBox: 95 380 1145 620
          - src: /images/feq-unicamp.jpg
            alt:
              pt: Faculdade de Engenharia Química, Unicamp
              en: School of Chemical Engineering, Unicamp
            width: 380
            height: 153
        links:
          - label:
              pt: Página do laboratório
              en: Laboratory website
            url:
              pt: https://erenova.feq.unicamp.br/lef-laboratorio-de-equilibrio-de-fases/
              en: https://erenova.feq.unicamp.br/lef-laboratorio-de-equilibrio-de-fases/
            icon: lucide:arrow-up-right
          - label:
              pt: Diretório CNPq
              en: CNPq directory
            url:
              pt: http://dgp.cnpq.br/dgp/espelhogrupo/233040
              en: http://dgp.cnpq.br/dgp/espelhogrupo/233040
            icon: lucide:arrow-up-right
      - id: udesc
        title:
          pt: ThermoPhase
          en: ThermoPhase
        eyebrow: LNCC / UDESC
        text:
          pt: >-
            O ThermoPhase é um grupo de pesquisa multi-institucional, com atuação tanto no LNCC
            quanto na UDESC. Sou um de seus líderes e atuo como colaborador externo na UDESC desde
            2023. O grupo reúne pesquisa em termodinâmica de fluidos e modelagem computacional,
            formação de alunos e desenvolvimento de software científico aberto.


            Os temas incluem propriedades de misturas ricas em CO₂ para CCS/CCUS e modelos híbridos
            para poços produtores e injetores, aproximando modelos físicos, dados operacionais e
            aprendizado de máquina.
          en: >-
            ThermoPhase is a multi-institutional research group based at both LNCC and UDESC. I am
            one of its co-leaders and have been an external collaborator at UDESC since 2023. The
            group brings together research in fluid thermodynamics and computational modeling,
            student supervision and open-source scientific software development.


            Topics include properties of CO₂-rich mixtures for CCS/CCUS and hybrid models for
            production and injection wells, connecting physical models, operational data and machine
            learning.
        images:
          - src: /images/thermophase.png
            alt:
