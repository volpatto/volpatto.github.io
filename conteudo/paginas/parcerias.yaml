            url: page:groups
            icon: lucide:arrow-up-right
          - label:
              pt: Orientações
              en: Student supervision
            url: page:people
            icon: lucide:arrow-up-right
  - type: cards
    id: projects-title
    title:
      pt: Projetos de pesquisa
      en: Research projects
    text:
      pt: Projetos de que participo como integrante da equipe.
      en: Projects in which I participate as a team member.
    items:
      - title:
          pt: Transferência de escala em rochas carbonáticas
          en: Upscaling in carbonate rocks
        eyebrow:
          pt: Desde 2026
          en: Since 2026
        text:
          pt: Métodos de transferência de escala e acoplamento hidromecânico para rochas carbonáticas com
            fraturas e feições vugulares. Participação em projeto coordenado por Márcio Arab Murad,
            com financiamento da Equinor Brasil.
          en: Upscaling methods and hydromechanical coupling for carbonate rocks with fractures and vugs.
            Participant in a project led by Márcio Arab Murad and funded by Equinor Brasil.
      - title:
          pt: Monitoramento de poços offshore
          en: Offshore well monitoring
        eyebrow:
          pt: Desde 2024
          en: Since 2024
        text:
          pt: Sistemas híbridos de dados e modelos para monitoramento de poços offshore de óleo e gás.
            Participação em projeto coordenado por Marcelo Souza de Castro e certificado pela PRIO
            no Lattes.
          en: Hybrid data and model systems for monitoring offshore oil and gas wells. Participant in a
            project led by Marcelo Souza de Castro and certified by PRIO in the Lattes record.
      - title:
          pt: Modelagem integrada da produção
          en: Integrated production modeling
        eyebrow:
          pt: Desde 2019
          en: Since 2019
        text:
          pt: Integração da modelagem de reservatórios e de produção de petróleo. Participação em projeto
            coordenado por Antonio Marinho Barbosa Neto.
          en: Integration of reservoir and petroleum production modeling. Participant in a project led by
            Antonio Marinho Barbosa Neto.
