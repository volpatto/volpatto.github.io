  - type: prose
    title:
      pt: Atuação e formação
      en: Academic background
    text:
      pt: >-
        Sou formado em Engenharia Química pela UFRN, com mestrado e doutorado em Modelagem
        Computacional pelo LNCC. Atuo como pesquisador no LNCC desde 2025.


        Sou um dos líderes do ThermoPhase (UDESC/LNCC) e membro do IPES. Também mantenho
        colaborações de pesquisa com a UDESC e a UNICAMP.


        Minha trajetória profissional e formação estão detalhadas na página de
        [currículo](page:cv).


        As páginas de [pesquisa](page:research), [publicações](page:publications) e [software](page:software)
        apresentam mais detalhes sobre meu trabalho.
      en: >-
        I hold a degree in Chemical Engineering from UFRN and MSc and DSc degrees in Computational
        Modeling from LNCC. I have been a researcher at LNCC since 2025.


        I am a co-leader of ThermoPhase (UDESC/LNCC) and a member of IPES. I also collaborate with
        researchers at UDESC and UNICAMP.


        My professional background and education are detailed in the [CV](page:cv) page.


        My [research](page:research), [publications](page:publications) and
        [software](page:software) pages describe my work in more detail.
