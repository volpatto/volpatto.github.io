  - type: profile
    id: hero-title
    title: Diego Volpatto
    eyebrow:
      pt: LNCC · Coordenação de Métodos Matemáticos e Computacionais (COMAC)
      en: LNCC · Mathematical and Computational Methods Section (COMAC)
    text:
      pt: >-
        Sou pesquisador adjunto do Laboratório Nacional de Computação Científica (LNCC/MCTI) e
        docente permanente do Programa de Pós-Graduação em Modelagem Computacional.


        Trabalho com métodos numéricos para escoamentos em meios porosos, termodinâmica
        computacional e aprendizado de máquina aplicado a problemas científicos.


        Minha experiência prévia na indústria de software inclui a atuação como desenvolvedor sênior
        de software científico para aplicações em óleo e gás. Nos projetos de pesquisa, adoto
        práticas de engenharia de software como testes automatizados, pacotes instaláveis e
        ambientes documentados para facilitar a reprodutibilidade.
      en: >-
        I am a researcher at the National Laboratory for Scientific Computing (LNCC/MCTI) and a
        faculty member of its Graduate Program in Computational Modeling.


        I work on numerical methods for porous media flow, computational thermodynamics and machine
        learning applied to scientific problems.


        My previous experience in the software industry includes work as a senior developer of
        scientific software for oil and gas applications. In my research projects, I adopt software
        engineering practices such as automated testing, installable packages and documented
        environments to support reproducibility.
