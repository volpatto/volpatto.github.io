      pt: Inferência & incertezas
      en: Inference & uncertainty
    text:
      pt: >-
        Calibração Bayesiana, análise de sensibilidade e propagação de incertezas em modelos
        computacionais.


        Estudo a identificação de parâmetros a partir de observações e seus efeitos sobre as
        previsões, com aplicações em sistemas dinâmicos e modelos epidemiológicos.
      en: >-
        Bayesian calibration, sensitivity analysis and uncertainty propagation in computational
        models.


        I study parameter identification from observations and its effects on predictions, with
        applications in dynamical systems and epidemiological models.
