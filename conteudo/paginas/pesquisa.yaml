  - type: figure
    id: research-4
    title:
      pt: Transporte reativo & geoquímica
      en: Reactive transport & geochemistry
    text:
      pt: >-
        Acoplamento de escoamento, transporte de espécies e reações geoquímicas em meios porosos
        heterogêneos.


        Os estudos integram Reaktoro e Firedrake para acompanhar a composição dos fluidos e a
        dissolução e precipitação de minerais.
      en: >-
        Coupling flow, species transport and geochemical reactions in heterogeneous porous media.


        Studies integrate Reaktoro and Firedrake to track fluid composition and mineral dissolution
        and precipitation.
