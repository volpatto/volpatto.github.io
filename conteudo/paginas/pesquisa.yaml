  - type: figure
    id: sciml
    title:
      pt: Aprendizagem de máquina científica (SciML)
      en: Scientific machine learning (SciML)
    text:
      pt: >-
        Estudo como incorporar informação física ao aprendizado de máquina e integrar modelos
        aprendidos a simulações científicas.


        ### Aprendizado sob demanda


        Reúso de estados de equilíbrio e sensibilidades para acelerar cálculos durante a simulação.
        Novas avaliações completas são feitas quando a aproximação não atende ao critério de
        aceitação.


        [Estudo de transporte reativo com ODML](https://doi.org/10.1007/s10596-021-10126-2)


        ### Termodinâmica híbrida


        Modelos neurais com balanço material por construção e treinamento orientado por relações
        termodinâmicas, como Gibbs–Duhem. As aplicações incluem cálculos de flash e pontos de
        fulgor.


        [Estudo GibbsFlashNN](https://github.com/ThermoPhase-FCSRG/gibbsflashnn-supporting-material)


        ### Métodos numéricos e informação física


        Acoplamento de modelos aprendidos a solvers, incluindo relações constitutivas neurais e
        diferenciação automática. Avalio precisão, resíduos físicos e custo computacional em relação
        a soluções de referência.


        [Ferramentas de termodinâmica
        diferenciável](https://thermophase-fcsrg.github.io/torch-flash/)
      en: >-
        I study how to incorporate physical information into machine learning and integrate learned
        models into scientific simulations.


        ### On-demand learning


        Reusing equilibrium states and sensitivities to accelerate calculations during simulation.
        New full evaluations are performed when an approximation fails the acceptance criterion.


        [Reactive transport study with ODML](https://doi.org/10.1007/s10596-021-10126-2)


        ### Hybrid thermodynamics


        Neural models with material balance preserved by construction and training guided by
        thermodynamic relations such as Gibbs–Duhem. Applications include flash calculations and
        flash points.


        [GibbsFlashNN study](https://github.com/ThermoPhase-FCSRG/gibbsflashnn-supporting-material)


        ### Numerical methods and physical information


        Coupling learned models with solvers, including neural constitutive relations and automatic
        differentiation. I assess accuracy, physical residuals and computational cost against
        reference solutions.


        [Differentiable thermodynamics tools](https://thermophase-fcsrg.github.io/torch-flash/)
