      pt: Métodos numéricos & meios porosos
      en: Numerical methods & porous media
    text:
      pt: >-
        Formulações de elementos finitos descontínuos, híbridos e estabilizados para escoamentos em
        meios heterogêneos.


        Investigo problemas multiescala, acoplamento hidromecânico e modelos de dupla porosidade e
        permeabilidade, com aplicações em rochas e reservatórios.
      en: >-
        Discontinuous, hybrid and stabilized finite element formulations for flow in heterogeneous
        media.


        I investigate multiscale problems, hydromechanical coupling and double-porosity and
        double-permeability models, with applications in rocks and reservoirs.
