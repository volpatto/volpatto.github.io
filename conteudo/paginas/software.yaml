  - type: prose
    title:
      pt: Engenharia de software e reprodutibilidade
      en: Software engineering and reproducibility
    text:
      pt: >-
        Desenvolvo os códigos de pesquisa seguindo práticas usadas na indústria de software:
        controle de versões, testes automatizados, verificações de qualidade e documentação. O
        objetivo é facilitar a instalação, a verificação, a manutenção e o reúso dos métodos
        computacionais.


        Minha experiência prévia na indústria de software, com desenvolvimento de aplicações
        científicas para óleo e gás, contribui para essa forma de trabalho. A trajetória
        profissional está descrita no [currículo](page:cv).


        **Testes e qualidade** — Suítes de testes automatizados e verificações em integração
        contínua, com casos de validação adequados ao escopo de cada pacote.


        **Distribuição em pacotes** — Pacotes Python instaláveis, com versões publicadas e
        dependências documentadas. Os links de distribuição estão indicados em cada projeto abaixo.


        **Ambientes reproduzíveis** — Dependências explícitas, ambientes Pixi, exemplos e instruções
        de execução para facilitar a reprodução do trabalho computacional.
      en: >-
        I develop research software following practices used in the software industry: version
        control, automated testing, code quality checks and documentation. The aim is to make
        computational methods easier to install, verify, maintain and reuse.


        My previous experience in the software industry, developing scientific applications for oil
        and gas, contributes to this approach. My professional background is described in the
        [CV](page:cv).


        **Testing and quality** — Automated test suites and checks in continuous integration, with
        validation cases appropriate to each package’s scope.


        **Package distribution** — Installable Python packages with versioned releases and
        documented dependencies. Package links are provided with each project below.


        **Reproducible environments** — Explicit dependencies, Pixi environments, examples and
        execution instructions to help others reproduce the computational work.
    tone: note
  - type: cards
    layout: rows
    items:
      - title: voids
        eyebrow:
          pt: Rocha digital
          en: Digital porous media
        text:
          pt: >-
            Modelagem de meios porosos digitais em Python: redes de poros, propriedades petrofísicas
            e simulação de transporte monofásico.


            Tem como foco modelos de redes de poros, com métodos complementares de volumes finitos,
            elementos finitos e Boltzmann em rede. A documentação reúne exemplos e distingue
            verificação numérica de validação experimental.
          en: >-
            Digital porous media modeling in Python: pore networks, petrophysical properties and
            single-phase transport simulation.


            Its main focus is pore network modeling, with complementary finite-volume,
            finite-element and lattice Boltzmann methods. The documentation includes examples and
            distinguishes numerical verification from experimental validation.
        images:
          - src: /images/voids-logo.png
            alt: Logo voids
            width: 597
            height: 359
        links:
          - label:
              pt: Documentação
              en: Documentation
            url: https://geomech-project.github.io/voids/
            icon: lucide:book-open
          - label: GitHub
            url: https://github.com/geomech-project/voids
            icon:
              src: /images/icons/github.svg
              monochrome: true
          - label: PyPI
            url: https://pypi.org/project/voids/
            icon: lucide:package
      - title: torch-flash
        eyebrow:
          pt: Termodinâmica diferenciável
          en: Differentiable thermodynamics
        text:
          pt: >-
            Propriedades termodinâmicas e equilíbrio de fases com PyTorch, integrando diferenciação
            automática, otimização e aprendizado de máquina.


            Inclui equações de estado, modelos de coeficiente de atividade e cálculos de
            estabilidade e flash. Exemplos documentados mostram a avaliação de propriedades, suas
            derivadas e o uso de parâmetros ajustáveis.
          en: >-
            Thermodynamic properties and phase equilibria with PyTorch, connecting automatic
            differentiation, optimization and machine learning.


            Includes equations of state, activity coefficient models, and stability and flash
            calculations. Documented examples cover property evaluation, derivatives and trainable
            parameters.
        images:
          - src: /images/torch-flash-logo.svg
            alt: Logo torch-flash
            width: 680
            height: 240
        links:
          - label:
              pt: Documentação
              en: Documentation
            url: https://thermophase-fcsrg.github.io/torch-flash/
            icon: lucide:book-open
          - label: GitHub
            url: https://github.com/ThermoPhase-FCSRG/torch-flash
            icon:
              src: /images/icons/github.svg
              monochrome: true
          - label: PyPI
            url: https://pypi.org/project/torch-flash/
            icon: lucide:package
          - label: Conda-Forge
            url: https://anaconda.org/conda-forge/torch-flash
            icon: lucide:package
      - title: thermoml-io
        eyebrow:
          pt: Dados termofísicos
          en: Thermophysical data
        text:
          pt: >-
            Acesso, busca e leitura de dados experimentais ThermoML em Python, preservando
            condições, incertezas e referências de cada medida.


            Permite organizar dados de publicações para análise e ajuste de modelos, com exportação
            tabular e rastreabilidade da fonte. Exemplos e notebooks documentam a busca, a leitura e
            o tratamento dos resultados.
          en: >-
            Access, search and parse experimental ThermoML data in Python, preserving conditions,
            uncertainties and references for each measurement.


            Helps organize published data for analysis and model fitting, with tabular export and
            source traceability. Examples and notebooks document searching, parsing and handling the
            results.
        images: []
        links:
          - label:
              pt: Documentação
              en: Documentation
            url: https://thermophase-fcsrg.github.io/thermoml-io/
            icon: lucide:book-open
          - label: GitHub
            url: https://github.com/ThermoPhase-FCSRG/thermoml-io
            icon:
              src: /images/icons/github.svg
              monochrome: true
          - label: PyPI
            url: https://pypi.org/project/thermoml-io/
            icon: lucide:package
          - label: Conda-Forge
            url: https://anaconda.org/conda-forge/thermoml-io
            icon: lucide:package
