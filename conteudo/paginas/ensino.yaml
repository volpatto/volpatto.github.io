introduction:
  pt: Disciplinas no Programa de Pós-Graduação em Modelagem Computacional do LNCC.
  en: Courses in the Graduate Program in Computational Modeling at LNCC.
courses:
  - code: GA-033
    description:
      pt: >-
        Implementação de elementos finitos: malhas, funções de base, quadratura, montagem de
        sistemas e condições de contorno. A ementa inclui verificação de implementações, taxas de
        convergência e aplicações com FEniCS, Firedrake e NGSolve.
      en: >-
        Finite element implementation: meshes, basis functions, quadrature, system assembly and
        boundary conditions. The syllabus includes implementation verification, convergence rates
        and applications with FEniCS, Firedrake and NGSolve.
    title:
      pt: "Método de Elementos Finitos: Implementação Computacional"
      en: "Finite Element Method: Computational Implementation"
    metadata:
      pt: LNCC · Pós-graduação · 36 h/a · 3 créditos
      en: LNCC · Graduate course · 36 hours · 3 credits
  - code: GA-020
    description:
      pt: >-
        Métodos para equações diferenciais ordinárias, diferenças finitas e elementos finitos.
        Abrange discretizações variacionais e a aproximação de problemas elípticos e parabólicos.
      en: >-
        Methods for ordinary differential equations, finite differences and finite elements. Covers
        variational discretizations and the approximation of elliptic and parabolic problems.
    title:
      pt: Solução Numérica de Equações Diferenciais
      en: Numerical Solution of Differential Equations
    metadata:
      pt: LNCC · Pós-graduação · 36 h/a · 3 créditos
      en: LNCC · Graduate course · 36 hours · 3 credits
