[workspace]
name = "diego-volpatto-website"
description = "Ambiente de desenvolvimento e build do site acadêmico"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
requires-pixi = ">=0.72.2"

[dependencies]
nodejs = "24.*"
# Mantenha esta versão igual a packageManager em package.json.
pnpm = "==11.19.0"

# Pixi instala Node.js e pnpm; pnpm instala Astro e as bibliotecas do site.
# Os dois lockfiles (pixi.lock e pnpm-lock.yaml) devem acompanhar o repositório.
# setup é idempotente e sempre confere o lockfile, inclusive após um git pull.
[tasks.setup]
cmd = "pnpm install --frozen-lockfile"
description = "Instala as dependências do site nas versões registradas"

[tasks.dev]
cmd = "pnpm dev"
depends-on = ["setup"]
description = "Abre a prévia local com atualização automática"

[tasks.check-content]
cmd = "pnpm check:content"
depends-on = ["setup"]
description = "Confere os arquivos YAML e as imagens referenciadas"

[tasks.check]
cmd = "pnpm check"
depends-on = ["setup"]
description = "Valida configuração, conteúdo e arquivos com o SciAstro"

[tasks.build]
cmd = "pnpm build"
depends-on = ["setup"]
description = "Gera os arquivos estáticos em dist/"

[tasks.build-lncc]
cmd = "pnpm verify"
depends-on = ["setup"]
env = { SITE_URL = "https://www.lncc.br", BASE_PATH = "/~volpatto/" }
description = "Gera e valida dist/ para https://www.lncc.br/~volpatto/"

[tasks.deploy-lncc]
cmd = "node scripts/deploy-lncc.mjs"
depends-on = ["build-lncc"]
description = "Gera, valida, faz backup e publica o site do LNCC em ../htdocs/"

[tasks.test]
cmd = "pnpm test"
depends-on = ["build"]
description = "Gera o site e testa o conteúdo, as páginas e os links"

[tasks.verify]
cmd = "pnpm verify"
depends-on = ["setup"]
description = "Valida conteúdo, build, Tests estáticos e segurança dos arquivos gerados"

[tasks.preview]
cmd = "pnpm preview"
depends-on = ["build"]
description = "Gera o site e abre a prévia do resultado estático"

[tasks.format]
cmd = "pnpm format"
depends-on = ["setup"]
description = "Formata o código; não modifica o conteúdo YAML"

[tasks.dev-stop]
cmd = "pnpm exec astro dev stop"
depends-on = ["setup"]
description = "Encerra o servidor de desenvolvimento deste projeto"

[tasks.preview-stop]
cmd = "pnpm exec astro preview stop"
depends-on = ["setup"]
description = "Encerra o servidor de prévia estática deste projeto"

[tasks.browser-install]
cmd = "pnpm exec playwright install chromium"
depends-on = ["setup"]
description = "Instala o navegador para os Tests automatizados"

[tasks.test-browser]
cmd = "pnpm test:browser"
depends-on = ["build"]
description = "Executa Browser Tests no desktop e no celular"

[tasks.verify-all]
cmd = "pnpm verify:all"
depends-on = ["setup"]
description = "Checks, build, Tests, auditoria de dependências e Browser Tests"

[tasks.audit-dependencies]
cmd = "pnpm audit:dependencies"
depends-on = ["setup"]
description = "Consulta vulnerabilidades conhecidas, incluindo dependências de build"

[tasks.security-build]
cmd = "pnpm security:build"
depends-on = ["build"]
description = "Inspeciona HTML, SVG e CSS gerados conforme security-policy.yaml"

[tasks.test-security-browser]
cmd = "pnpm test:security-browser"
depends-on = ["build"]
description = "Executa os Browser Tests de CSP, conexões, navegação e downloads"

[tasks.security]
cmd = "pnpm security"
depends-on = ["build"]
description = "Gera o site e executa as três verificações de segurança"
