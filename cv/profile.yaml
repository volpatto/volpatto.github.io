# Seleção acadêmica; o registro integral continua disponível na Plataforma Lattes.
# Não inclui endereço, telefone, nascimento ou outros dados pessoais do XML.
include:
  - profile
  - education
  - experience
  - research.lines
  - activities.teaching
  - research.projects
  - publications.articles
  - publications.conference
  - technical.software
  - supervision
  - committees
  - awards
  - languages
order:
  - profile
  - education
  - experience
  - research.lines
  - publications.articles
  - research.projects
  - activities.teaching
  - supervision.ongoing
  - supervision.completed
  - publications.conference
  - technical.software
  - committees
  - awards
  - languages
hide_fields: [contact, summary, details]
language: pt
bibliography_style: abnt
authors:
  name_case: original
  highlight_self: true
  et_al: false
  use_informed_citation: true
sections:
  profile:
    show_birth_date: false
    show_birth_place: false
  education:
    title: Formação acadêmica
    show_thesis: true
    show_advisors: true
    show_scholarship: false
  research.projects:
    title: Projetos de pesquisa
    show_members: false
    show_description: false
  publications.articles:
    show_authors: true
    show_links: true
    show_details: true
